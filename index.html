<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#100c09" />
<meta name="description" content="Rokumon Forge — an idle forge of Japanese and ninja weapons." />
<title>Rokumon Forge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23100c09' width='32' height='32'/%3E%3Cpath fill='%23e4b15a' d='M16 3l2 9h8l-6 5 2 9-6-4-6 4 2-9-6-5h8z'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #100c09;
    --soot: #1c1612;
    --card: #261c16;
    --line: #3c2e24;
    --ash: #c8bfb2;
    --muted: #a89888;
    --text: #f0e6d8;
    --ember: #e25a1c;
    --ember-deep: #8a2e10;
    --gold: #e4b15a;
    --gold-dim: #8c6a32;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); }
  body {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    color-scheme: dark;
  }
  button { font: inherit; color: inherit; background: transparent; border: 0; padding: 0; }
  button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
  button:disabled, [aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .app {
    min-height: 100dvh;
    max-width: 1120px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mon { width: 36px; height: 36px; color: var(--gold); flex: 0 0 auto; }
  .brand h1 {
    font-family: var(--serif);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1.1;
  }
  .brand p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .header-stats { margin-left: auto; display: flex; gap: 8px; align-items: stretch; }
  .stat {
    min-height: 44px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    background: var(--soot);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stat .k { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stat b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .icon-btn {
    width: 44px; height: 44px;
    border: 1px solid var(--line);
    color: var(--ash);
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .resources {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px;
    scrollbar-width: none;
  }
  .resources::-webkit-scrollbar { display: none; }
  .res {
    flex: 0 0 auto;
    min-width: 112px;
    min-height: 52px;
    padding: 6px 10px;
    background: var(--card);
    border: 1px solid var(--line);
  }
  .res.rare { border-color: var(--gold-dim); }
  .res .top { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .res .k { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  .res .v { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .res .r { color: var(--gold); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ico { width: 14px; height: 14px; fill: currentColor; }
  .ico .line { fill: none; stroke: currentColor; }
  .workspace { display: flex; flex-direction: column; gap: 14px; }
  .hearth {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 2.15 / 1;
    margin: 0 auto 10px;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 78%, rgba(226, 90, 28, 0.55), transparent 46%),
      radial-gradient(ellipse at 50% 100%, #2a120c 0%, var(--ink) 72%);
    border: 1px solid var(--line);
  }
  .hearth.thump { animation: thump 140ms ease-out; }
  @keyframes thump {
    40% { transform: scale(0.985); }
  }
  .coals i {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); bottom: 30%;
    animation: floatember 2.6s ease-in-out infinite;
  }
  .coals i:nth-child(1) { left: 34%; }
  .coals i:nth-child(2) { left: 42%; animation-delay: -0.4s; background: var(--ember); }
  .coals i:nth-child(3) { left: 50%; animation-delay: -1s; }
  .coals i:nth-child(4) { left: 58%; animation-delay: -1.6s; background: var(--ember); }
  .coals i:nth-child(5) { left: 46%; animation-delay: -2s; width: 5px; height: 5px; }
  .coals i:nth-child(6) { left: 54%; animation-delay: -0.8s; width: 4px; height: 4px; }
  @keyframes floatember {
    0%, 100% { opacity: 0.35; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-10px); }
  }
  .anvil { position: absolute; width: 46%; left: 27%; bottom: 16%; }
  .hammer {
    position: absolute; width: 54px; height: 54px; left: 58%; top: 16%;
    transform-origin: 50% 84%; pointer-events: none;
  }
  .hammer.swing { animation: swing 160ms ease-out; }
  @keyframes swing {
    0% { transform: rotate(-34deg); }
    55% { transform: rotate(8deg); }
    100% { transform: rotate(0deg); }
  }
  #sparks { position: absolute; inset: 0; pointer-events: none; }
  .spark {
    position: absolute; top: 64%; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold); animation: spark 480ms ease-out forwards;
  }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .job { margin-bottom: 8px; }
  .job-top, .pact-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .bar { height: 8px; background: var(--ink); border: 1px solid var(--line); margin-top: 4px; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ember-deep), var(--ember)); }
  .idle-copy { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  .heat-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .heat { flex: 1; height: 8px; background: var(--ink); border: 1px solid var(--line); }
  .heat > span { display: block; height: 100%; background: var(--gold); width: 0; }
  .stage-actions { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
  .note { margin: 8px 0; color: var(--muted); font-size: 12px; }
  .suggest { width: 100%; margin-bottom: 4px; }
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 280px; }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--ink); border: 1px solid var(--line); }
  .tabs button {
    flex: 1; min-height: 44px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;
  }
  .tabs button[aria-selected="true"] { color: var(--text); background: var(--card); }
  .panel-body { padding: 12px 2px 8px; }
  .detail {
    display: grid; grid-template-columns: 84px 1fr; gap: 12px;
    margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .detail .art {
    height: 84px; color: var(--gold); background: var(--ink);
    border: 1px solid var(--line); display: grid; place-items: center; padding: 8px;
  }
  .detail h2 { font-family: var(--serif); font-size: 1.35rem; margin: 0; font-weight: 600; }
  .kana { color: var(--gold); font-size: 12px; letter-spacing: 0.08em; }
  .lore { margin: 4px 0 8px; color: var(--ash); }
  .costs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .cost { font-size: 12px; padding: 3px 6px; border: 1px solid var(--line); color: var(--muted); }
  .cost.short { color: var(--ember); border-color: var(--ember-deep); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .group-label {
    margin: 14px 0 8px; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold);
  }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .w-card, .u-card, .p-card {
    border: 1px solid var(--line); background: var(--card); padding: 10px 10px 12px; text-align: left;
  }
  .w-card.on { border-color: var(--gold-dim); }
  .w-card .nm, .u-card .nm, .p-card .nm { font-family: var(--serif); font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .btn {
    min-height: 44px; padding: 0 12px;
    border: 1px solid var(--line); background: var(--soot); color: var(--text);
  }
  .btn-ember { background: var(--ember); border-color: var(--ember); color: #1a0c08; font-weight: 600; }
  .btn-gold { color: var(--gold); border-color: var(--gold-dim); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .check { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ash); }
  .check input { width: 24px; height: 24px; margin: 0; accent-color: var(--ember); }
  .gallery {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 12px;
    scroll-snap-type: x mandatory;
  }
  .g-card {
    flex: 0 0 76px; scroll-snap-align: start;
    min-height: 84px; border: 1px solid var(--line); background: var(--soot);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; position: relative; color: var(--ash); padding: 6px 4px;
  }
  .g-card.on { border-color: var(--gold); color: var(--gold); }
  .g-card.locked { color: var(--muted); border-style: dashed; }
  .g-card.locked .g-svg { opacity: 0.5; }
  .g-svg { width: 36px; height: 36px; }
  .g-svg svg, .art svg, .sil { width: 100%; height: 100%; fill: currentColor; }
  .sil .line { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .g-name { font-size: 10px; letter-spacing: 0.04em; text-align: center; line-height: 1.2; }
  .g-count {
    position: absolute; top: 3px; right: 4px; font-size: 10px; color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .q { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .q-fine { background: var(--ember); }
  .q-masterwork, .q-legendary { background: var(--gold); }
  .q-legendary { box-shadow: 0 0 0 2px var(--gold-dim); }
  .ledger-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ledger-grid div { border: 1px solid var(--line); padding: 8px 10px; background: var(--card); }
  .ledger-grid .k { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .req { margin: 4px 0; color: var(--muted); }
  .req.ok { color: var(--gold); }
  .journal { list-style: none; padding: 0; margin: 8px 0 0; }
  .journal li { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ash); font-size: 13px; }
  .journal time { color: var(--muted); margin-right: 6px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--soot); color: var(--text); border: 1px solid var(--gold-dim);
    padding: 10px 14px; opacity: 0; pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    max-width: min(92vw, 420px); text-align: center; z-index: 30;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(16, 12, 9, 0.76);
    display: grid; place-items: center; padding: 16px;
  }
  .modal.hidden { display: none; }
  .sheet {
    width: min(540px, 100%);
    max-height: min(86dvh, 740px);
    overflow: auto;
    background: var(--soot);
    border: 1px solid var(--gold-dim);
    border-top: 3px solid var(--gold);
    padding: 22px 18px 16px;
    user-select: text;
  }
  .sheet h2 { font-family: var(--serif); font-size: 1.7rem; margin: 0 0 8px; font-weight: 600; }
  .sheet h3 { font-family: var(--serif); font-size: 1.05rem; margin: 14px 0 4px; color: var(--gold); font-weight: 600; }
  .sheet p { margin: 0 0 8px; color: var(--ash); }
  .sheet .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .gain { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  @media (min-width: 861px) {
    .app { height: 100dvh; overflow: hidden; }
    .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 0.92fr) minmax(340px, 1.15fr); gap: 18px; }
    .stage, .panel { min-height: 0; }
    .panel { overflow: hidden; }
    .panel-body { flex: 1; min-height: 0; overflow: auto; }
    .stage { overflow: auto; }
  }
  @media (max-width: 860px) {
    .hearth { aspect-ratio: 2.6 / 1; margin-bottom: 6px; }
    .header-stats .stat.hide-sm { display: none; }
    .gallery { order: 3; padding-top: 0; }
    .workspace { order: 4; }
    .tabs { position: sticky; top: 0; z-index: 4; }
  }
  @media (max-width: 420px) {
    .stage-actions { grid-template-columns: 1fr 1fr; }
    #strike { grid-column: 1 / -1; }
    .detail { grid-template-columns: 64px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="mon" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="32" cy="10" r="3.2" fill="currentColor"/>
        <circle cx="51" cy="21" r="3.2" fill="currentColor"/>
        <circle cx="51" cy="43" r="3.2" fill="currentColor"/>
        <circle cx="32" cy="54" r="3.2" fill="currentColor"/>
        <circle cx="13" cy="43" r="3.2" fill="currentColor"/>
        <circle cx="13" cy="21" r="3.2" fill="currentColor"/>
      </svg>
      <div>
        <h1>Rokumon Forge</h1>
        <p>Six crests. One fire.</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat hide-sm"><span class="k">Prestige</span><b id="prestige-label">—</b></div>
      <div class="stat hide-sm"><span class="k">Mastery</span><b id="mastery-label">0</b></div>
      <div class="stat"><span class="k">Score</span><b id="score">0</b></div>
      <button type="button" class="icon-btn" data-act="howto" aria-label="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 114 2c-.8.6-1.5 1.1-1.5 2.2V14"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="icon-btn" id="mute" data-act="mute" aria-pressed="false" aria-label="Mute sound"></button>
    </div>
  </header>
  <div id="resources" class="resources"></div>
  <div class="workspace">
    <section class="stage" aria-label="Forge">
      <div class="hearth" id="hearth">
        <div class="coals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <svg class="anvil" viewBox="0 0 120 50" aria-hidden="true">
          <path fill="#c8bfb2" d="M6 30h74l12-10h22v12H96L86 42H20L8 50H2V36z"/>
          <path fill="#8a7e72" d="M42 42h26v7H42z"/>
        </svg>
        <svg id="hammer" class="hammer" viewBox="0 0 80 80" aria-hidden="true">
          <rect x="36" y="30" width="6" height="38" fill="#c8bfb2"/>
          <rect x="20" y="16" width="36" height="16" fill="#e4b15a"/>
        </svg>
        <div id="sparks"></div>
      </div>
      <div id="jobs"></div>
      <div class="heat-row"><span>Heat</span><div class="heat"><span id="heatbar"></span></div><span id="heatnum">0</span></div>
      <div class="stage-actions">
        <button type="button" class="btn btn-ember" id="strike" data-act="strike">Strike</button>
        <button type="button" class="btn" id="fold" data-act="fold" aria-disabled="true">Fold</button>
        <button type="button" class="btn" id="fold-all" data-act="fold-all" aria-disabled="true">Fold all</button>
      </div>
      <p id="stage-note" class="note"></p>
      <button type="button" class="btn btn-gold suggest" id="suggest" data-act="suggest"></button>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist" aria-label="Forge sections">
        <button type="button" data-act="tab" data-id="arms" role="tab" id="tab-arms" aria-controls="panel">Arms</button>
        <button type="button" data-act="tab" data-id="workshop" role="tab" id="tab-workshop" aria-controls="panel">Workshop</button>
        <button type="button" data-act="tab" data-id="metals" role="tab" id="tab-metals" aria-controls="panel">Metals</button>
        <button type="button" data-act="tab" data-id="ledger" role="tab" id="tab-ledger" aria-controls="panel">Ledger</button>
      </div>
      <div id="panel" class="panel-body" role="tabpanel" aria-labelledby="tab-arms"></div>
    </section>
  </div>
  <div id="gallery" class="gallery" aria-label="Weapon gallery"></div>
</div>
<div id="toast" aria-hidden="true"></div>
<div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="modal" class="modal hidden"></div>
<script src="/hub-bridge.js"></script>
<script id="forge-logic">
/* Rokumon Forge rules. Pure: no DOM, no storage, no timers, no network.
   Every function takes the state it changes, the time it should use and,
   where chance matters, a random source. The page script below drives it;
   the dev-only tests load this block in a VM. */
(function (root) {
  "use strict";

  var SAVE_KEY = "rokumon-forge-v1";
  var BACKUP_KEY = "rokumon-forge-v1-unreadable";
  var SAVE_VERSION = 2;
  var OFFLINE_MIN_GAP = 45;               // seconds; shorter gaps count as live play
  var CLOCK_FORGIVE_MS = 24 * 3600 * 1000; // a save from further in the future than this is treated as a wrong clock
  var MARKET_INTERVAL = 8 * 60 * 1000;
  var MAX_AMOUNT = 1e15;
  var MAX_COUNT = 1e9;
  var MAX_PRESTIGE = 1000;
  var RACK_SIZE = 40;
  var JOURNAL_SIZE = 18;
  var GRANT_MAX = 25;
  var GRANT_PER_MINUTE = 12;

  var FOLD = { satetsu: 36, sumi: 22 };
  var Q_ORDER = ["crude", "serviceable", "fine", "masterwork", "legendary"];
  var Q_RANK = { crude: 0, serviceable: 1, fine: 2, masterwork: 3, legendary: 4 };
  var Q_NAME = { crude: "Crude", serviceable: "Serviceable", fine: "Fine", masterwork: "Masterwork", legendary: "Legendary" };
  var Q_MULT = { crude: 0.7, serviceable: 1, fine: 1.55, masterwork: 2.4, legendary: 4 };
  var Q_MASTERY = { crude: 0, serviceable: 1, fine: 2, masterwork: 4, legendary: 8 };

  var MATS = [
    { id: "satetsu", name: "Satetsu", rare: false },
    { id: "sumi", name: "Sumi", rare: false },
    { id: "urushi", name: "Urushi", rare: false },
    { id: "whetstone", name: "Whetstone", rare: false },
    { id: "tamahagane", name: "Tamahagane", rare: false },
    { id: "spirit", name: "Spirit iron", rare: true },
    { id: "silk", name: "Moon silk", rare: true },
    { id: "scale", name: "Dragon scale", rare: true }
  ];
  var MAT_NAME = Object.create(null);
  MATS.forEach(function (m) { MAT_NAME[m.id] = m.name; });
  var MAT_ALIAS = {
    spirit: "spirit", "spirit-iron": "spirit", reitekkou: "spirit", spiritiron: "spirit",
    silk: "silk", "moon-silk": "silk", moonsilk: "silk", tsukuyomi: "silk",
    scale: "scale", "dragon-scale": "scale", dragonscale: "scale"
  };

  function scaleCost(base, growth, lv) { return Math.floor(base * Math.pow(growth, lv)); }

  var UPGRADES = [
    { id: "bellows", name: "Bellows", max: 25, blurb: "Draws more iron sand and charcoal through the fire.", effect: "+0.48 sand and +0.28 coal each level.", cost: function (lv) { return { satetsu: scaleCost(18, 1.52, lv) }; } },

  function makeCtx(opts) {

  // ---------- feedback: toast (visual), announce (screen readers) ----------

  function toast(text) {

  // ---------- sound (Web Audio, nothing fetched, silent when muted) ----------

  function ac() {
    if (muted) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {

      if (audioCtx.state === "suspended") audioCtx.resume();

  function tone(freq, t, dur, type, gain) {
    var ctx = ac();
    if (!ctx) return;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(Math.max(0.0001, gain), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur);
  }
  function playStrike() {
    var ctx = ac();
    if (!ctx) return;
    var t = ctx.currentTime;
    var len = Math.floor(ctx.sampleRate * 0.05);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 380;
    var g = ctx.createGain();
    g.gain.value = 0.16;
    src.connect(filter); filter.connect(g); g.connect(ctx.destination);
    src.start(t);
    tone(148, t, 0.07, "triangle", 0.06);

  function playForge() {

    var ctx = ac();
    if (!ctx) return;
    var t = ctx.currentTime;
    tone(110, t, 0.55, "sine", 0.07);
    tone(220, t + 0.12, 0.45, "sine", 0.04);
    tone(440, t + 0.28, 0.5, "triangle", 0.035);

      s.style.setProperty("--dy", (-20 - Math.random() * 46) + "px");

  // ---------- events from the rules ----------

  function handle(ctx) {
    if (!ctx.events.length) return;
    dirty = true;
    if (ctx.offline) return; // offline work is summarised once, not replayed
    ctx.events.forEach(function (ev) {
      var w = ev.id && weaponById[ev.id];
      if (ev.type === "forged") {
        var line = w.name + " quenched · " + Q_NAME[ev.quality];
        if (ev.first) tell("First " + line);
        else if (ev.auto) toast(line);
        else tell(line);
        playForge();
        hubEvent("weapon-forged", { weaponId: ev.id, tier: ev.tier, quality: ev.quality, value: ev.value });
        reportScore(false);
      } else if (ev.type === "forge-started") {
        if (!ev.auto) { announce("Forging " + w.name); playUpgrade(); }
      } else if (ev.type === "pact") {
        tell(MAT_NAME[ev.material] + " arrived");
        playForge();
        hubEvent("contract-fulfilled", { contractId: ev.id, material: ev.material, amount: ev.amount });
      } else if (ev.type === "pact-started") {
        announce("Runner sent: " + L.pactById[ev.id].name);
        playUpgrade();
      } else if (ev.type === "upgraded") {
        var u = upgradeById[ev.id];
        if (ev.id === "water" && ev.level === 1) tell("The water wheel can tend a pinned blade");
        else if (ev.id === "apprentices" && (ev.level === 4 || ev.level === 8)) tell("Another anvil opens");
        else if (ev.id === "bell" && ev.level === 5) tell("A second runner joins");
        else announce(u.name + " level " + ev.level);
        playUpgrade();
        hubEvent("forge-upgraded", { upgradeId: ev.id, level: ev.level });
      } else if (ev.type === "traded") {
        announce("Traded for " + ev.label);
        playUpgrade();
      } else if (ev.type === "folded") {
        announce("Folded " + ev.n + " tamahagane");
        playUpgrade();
      } else if (ev.type === "retired") {
        tell("Mastery +" + ev.gain);
        playUpgrade();
        hubEvent("weapon-retired", { weaponId: ev.id, tier: ev.tier, mastery: ev.mastery });
        reportScore(false);
      } else if (ev.type === "set-aside") {
        tell("Crude " + (w ? w.name : "blade") + " set aside");
      } else if (ev.type === "retired-all") {
        if (ev.gain > 0) { tell("Mastery +" + ev.gain); playUpgrade(); reportScore(false); }
        else tell("Nothing on the rack worth retiring");
      } else if (ev.type === "granted") {
        tell(MAT_NAME[ev.material] + " +" + ev.amount);
        hubEvent("material-granted", { material: ev.material, amount: ev.amount, source: ev.source });
      } else if (ev.type === "prestige") {
        if (window.Hub && typeof window.Hub.gameOver === "function") {
          try { window.Hub.gameOver(ev.scoreBefore, ev.durationMs); } catch (e) {}
        }
        tell("Prestige " + roman(ev.level) + ". The coals are banked.");
        playPrestige();
        hubEvent("prestige", { level: ev.level, score: ev.score });
        reportScore(true);
      }
    });
  }
  // Run a player action, report a refusal, persist a success.
  function act(fn) {

  // ---------- save ----------

  function storage() {

  function save() {
    state.mute = muted;

    if (!ls) return;

  }
  function load() {
    var ls = storage();
    var raw = null;
    if (ls) { try { raw = ls.getItem(L.SAVE_KEY); } catch (e) { raw = null; } }

    if (out.status === "reset" && ls) {
      // Keep the unreadable text aside rather than destroying it.
      try { ls.setItem(L.BACKUP_KEY, String(raw).slice(0, 500000)); } catch (e) {}
    }
    state = out.state;
    muted = !!state.mute;
    return out;

    html += '<p class="lore">Bank the coals and begin again. Workshop levels, common stock, tamahagane and the rack are cleared. Mastery is taken from the rack first. Catalogue metals, the codex and your score remain. Output rises by 15%.</p>';
    html += '<p class="req' + ((state.run.bestTier || 0) >= 6 ? " ok" : "") + '">Quench a tier 6 weapon this firing (tachi, yumi, and onward).</p>';
    html += '<p class="req' + ((state.run.legendRetires || 0) > 0 ? " ok" : "") + '">Or retire a legendary blade of tier 5 or higher this firing.</p>';
    if (state.prestige === 0) html += '<p class="meta">The first rekindle opens the outland armoury.</p>';
    else if (state.prestige === 1) html += '<p class="meta">The next rekindle reveals the claymore.</p>';
    html += '<button type="button" class="btn btn-ember" data-act="prestige-open"' + off(!req) + ">Rekindle the forge</button>";
    html += "<h3 class=\"group-label\">Journal</h3><ul class=\"journal\">";
    if (!state.journal.length) html += "<li>The ledger is blank.</li>";
    state.journal.forEach(function (entry) {
      var clock = "";
      try { clock = new Date(entry.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) {}
      html += "<li><time>" + esc(clock) + "</time>" + esc(entry.text) + "</li>";
    });
    html += "</ul>";
    return html;
  }

  /* Re-rendering replaces buttons, which would drop keyboard focus on the body.
     Remember which control had focus and put it back on its replacement. */
  function focusKey(el) {
    if (!el || !el.getAttribute) return null;
    var a = el.getAttribute("data-act");
    if (!a) return null;
    return { act: a, id: el.getAttribute("data-id"), uid: el.getAttribute("data-uid") };
  }
  function findByKey(host, key) {
    if (!key) return null;
    var sel = '[data-act="' + key.act + '"]';
    if (key.id) sel += '[data-id="' + key.id + '"]';
    if (key.uid) sel += '[data-uid="' + key.uid + '"]';
    return host.querySelector(sel);
  }
  function rerender(host, html) {
    var had = host.contains(document.activeElement) ? document.activeElement : null;
    var key = focusKey(had);
    var scroll = host.scrollTop;
    host.innerHTML = html;
    host.scrollTop = scroll;
    if (!had) return;
    var target = findByKey(host, key);
    if (!target && key && key.act === "retire") target = host.querySelector('[data-act="retire"]') || host.querySelector('[data-act="retire-all"]');
    if (target && !target.disabled) target.focus({ preventScroll: true });
    else { host.setAttribute("tabindex", "-1"); host.focus({ preventScroll: true }); }
  }
  function renderPanel() {
    var el = $("panel");
    document.querySelectorAll(".tabs [role=tab]").forEach(function (btn) {
      var on = btn.getAttribute("data-id") === state.tab;
      btn.setAttribute("aria-selected", on ? "true" : "false");
      btn.setAttribute("tabindex", on ? "0" : "-1");
    });
    el.setAttribute("aria-labelledby", "tab-" + state.tab);
    var html = "";
    if (state.tab === "workshop") html = renderWorkshop();
    else if (state.tab === "metals") html = renderMetals();
    else if (state.tab === "ledger") html = renderLedger();
    else html = renderArms();
    rerender(el, html);
  }
  function renderDynamic() {
    renderJobs();
    renderPanel();
    var gallery = $("gallery");
    var had = gallery.contains(document.activeElement) ? focusKey(document.activeElement) : null;
    var scroll = gallery.scrollLeft;
    renderGallery();
    gallery.scrollLeft = scroll;
    if (had) { var t = findByKey(gallery, had); if (t) t.focus({ preventScroll: true }); }
  }
  function paint() {
    $("score").textContent = fmtInt(L.computeScore(state));
    $("prestige-label").textContent = state.prestige ? roman(state.prestige) : "—";
    $("mastery-label").textContent = fmtInt(state.mastery);
    var r = L.rates(state);
    MATS.forEach(function (m) {
      var amt = document.querySelector('[data-amt="' + m.id + '"]');
      if (amt) amt.textContent = fmt(state.mats[m.id]);
      var rate = document.querySelector('[data-rate="' + m.id + '"]');
      if (!rate) return;
      if (m.id === "tamahagane") rate.textContent = state.upgrades.folder ? fmtRate(r.tamahagane) : "folded";
      else if (m.rare) rate.textContent = "courier";
      else rate.textContent = fmtRate(r[m.id] || 0);
    });
    var heat = Math.max(0, Math.min(100, state.heat || 0));
    $("heatbar").style.width = heat + "%";
    $("heatnum").textContent = String(Math.round(heat));
    var speed = Math.max(0.25, L.forgeSpeed(state, false));
    state.jobs.forEach(function (job) {
      var bar = document.querySelector('[data-prog="' + job.uid + '"]');
      if (bar) bar.style.width = Math.max(0, Math.min(100, (job.progress / job.time) * 100)).toFixed(1) + "%";
      var left = document.querySelector('[data-left="' + job.uid + '"]');
      if (left) left.textContent = fmtDur(Math.max(0, (job.time - job.progress) / speed));
    });
    state.pacts.forEach(function (p) {
      var bar = document.querySelector('[data-pact="' + p.id + '"]');
      if (bar) bar.style.width = Math.max(0, Math.min(100, (1 - p.remaining / p.total) * 100)).toFixed(1) + "%";
      var left = document.querySelector('[data-pact-left="' + p.id + '"]');
      if (left) left.textContent = fmtDur(p.remaining) + " remaining";
    });
    var eta = $("market-eta");
    if (eta) eta.textContent = "Restocks in " + fmtDur(Math.max(0, (state.market.nextAt - Date.now()) / 1000));
    var folds = L.foldsAvailable(state);
    var foldBtn = $("fold");
    var foldAll = $("fold-all");
    foldBtn.textContent = "Fold" + (folds ? " 1" : "");
    setOff(foldBtn, folds < 1);
    foldAll.textContent = folds >= 2 ? "Fold all " + fmtInt(folds) : "Fold all";
    setOff(foldAll, folds < 2);
    $("stage-note").textContent = "Output ×" + L.globalMult(state).toFixed(2) + " · Quench ×" + L.offlineSpeed(state).toFixed(2) + " · Away " + Math.round(L.offlineEff(state) * 100) + "% for " + fmtDur(L.offlineCapSeconds(state)) + " · Anvils " + state.jobs.length + "/" + L.slots(state);
    var suggest = $("suggest");
    var nxt = L.nextWeapon(state);
    var text;
    if (!nxt) text = "The codex is quiet";
    else if (state.jobs.length >= L.slots(state)) text = "Anvil occupied · " + nxt.name;
    else if (L.canAfford(state, nxt.cost) && L.needMet(state, nxt).ok) text = "Forge " + nxt.name;
    else text = "Toward " + nxt.name + (L.needMet(state, nxt).ok ? " · need " + L.shortfall(state, nxt.cost) : " · " + L.needMet(state, nxt).why);
    if (suggest.textContent !== text) suggest.textContent = text;
    suggest.dataset.wid = nxt ? nxt.id : "";
    document.querySelectorAll("[data-cost-mat]").forEach(function (el) {
      var ok = L.have(state, el.getAttribute("data-cost-mat")) + 1e-6 >= Number(el.getAttribute("data-cost-need"));
      el.classList.toggle("short", !ok);
      el.classList.toggle("ok", ok);
    });
    document.querySelectorAll('#panel [data-act="forge"]').forEach(function (btn) {
      var w = weaponById[btn.getAttribute("data-id")];
      setOff(btn, !w || state.jobs.length >= L.slots(state) || !L.canAfford(state, w.cost));
    });
    document.querySelectorAll('#panel [data-act="buy"]').forEach(function (btn) {
      var u = upgradeById[btn.getAttribute("data-id")];
      if (!u) return;
      var lv = state.upgrades[u.id] || 0;
      setOff(btn, lv >= u.max || !L.canAfford(state, u.cost(lv)));
    });
    document.querySelectorAll('#panel [data-act="market"]').forEach(function (btn) {
      var offer = L.marketById[btn.getAttribute("data-id")];
      if (!offer) return;
      setOff(btn, (state.market.stock[offer.stockKey] || 0) <= 0 || !L.canAfford(state, offer.cost));
    });
  }
  function updateMute() {
    var b = $("mute");
    b.setAttribute("aria-pressed", muted ? "true" : "false");
    b.setAttribute("aria-label", "Mute sound");
    b.innerHTML = muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M16 9a4 4 0 010 6"/><path d="M18.5 7a7 7 0 010 10"/></svg>';
  }

  // ---------- dialogs ----------

  function openModal(html, dismiss) {
    var m = $("modal");
    if (!modalOpen()) modalReturnFocus = document.activeElement;
    m.dataset.dismiss = dismiss ? "1" : "0";
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">' + html + "</div>";
    m.classList.remove("hidden");
    var first = m.querySelector(".actions button");
    if (first) first.focus();
  }
  function closeModal() {
    var m = $("modal");
    if (!modalOpen()) return;
    // Any way out of the welcome sheet counts as having read it.
    if (m.dataset.kind === "guide" && !state.welcomed) { state.welcomed = true; save(); }
    m.classList.add("hidden");
    m.innerHTML = "";
    m.dataset.kind = "";
    var back = modalReturnFocus;
    modalReturnFocus = null;
    if (back && document.contains(back) && typeof back.focus === "function") back.focus();
    else $("strike").focus();
  }
  function modalOpen() { return !$("modal").classList.contains("hidden"); }
  function openGuide() {
    openModal(
      '<h2 id="modal-title">How the forge works</h2>' +
      "<h3>Materials</h3><p>The coals draw satetsu, sumi, urushi and whetstone on their own. Strike to raise heat and, while the anvil is empty, to sift a little extra sand. Fold 36 sand and 22 coal into one tamahagane bar. Spirit iron, moon silk and dragon scale are catalogue metals: pacts stand in until other Rokumon games can pay them in.</p>" +
      "<h3>Workshop</h3><p>Bellows, apprentices and the water wheel speed the work and keep it honest while you are away. Pin a blade once the wheel turns, and the forge will keep quenching that pattern.</p>" +
      "<h3>Blades</h3><p>Forge up the old steel line, from tanto to odachi. Quality is rolled at the quench. Retire fine work for permanent mastery. When this firing has a tier 6 blade, or you retire a legendary of tier 5 or higher, rekindle: the workshop resets, the codex and the rare metals stay, and the fire burns hotter.</p>" +
      "<h3>Keys</h3><p>Space strikes when no button has focus. Tab moves between controls, Enter or Space presses them, and the arrow keys move between the four sections.</p>" +
      '<div class="actions"><button type="button" class="btn btn-ember" data-act="close">' + (state.welcomed ? "Close" : "Light the forge") + "</button></div>",
      true
    );
    $("modal").dataset.kind = "guide";
  }
  function openAway(report) {
    var rows = "";
    MATS.forEach(function (m) {
      if (report.gained[m.id]) rows += '<div class="gain"><span>' + esc(m.name) + "</span><b>+" + fmt(report.gained[m.id]) + "</b></div>";
    });
    var blades = Object.keys(report.forged).map(function (id) {
      return esc(weaponById[id].name) + " ×" + report.forged[id];
    }).join(", ");
    var html = '<h2 id="modal-title">While you were away</h2>';
    html += '<p data-away="summary">Gone ' + fmtDur(report.away) + ". The coals held for " + fmtDur(report.counted) + " at " + Math.round(report.eff * 100) + "%.</p>";
    if (report.capped) html += "<p>The fire slept after the cap. Apprentices keep a longer watch.</p>";
    html += rows || "<p>Little changed in the stock.</p>";
    if (blades) html += "<p>Quenched: " + blades + ".</p>";
    if (report.folded) html += "<p>Folded " + fmtInt(report.folded) + " tamahagane.</p>";
    html += '<div class="actions"><button type="button" class="btn btn-ember" data-act="close">Return to the anvil</button></div>';
    openModal(html, true);
    $("modal").dataset.kind = "away";
  }
  function openPrestige() {
    var extra = state.prestige === 0 ? " The outland armoury opens." : (state.prestige === 1 ? " Claymore patterns unlock." : "");
    openModal(
      '<h2 id="modal-title">Rekindle the forge?</h2><p>Common stock, tamahagane, workshop levels, running pacts and the rack are cleared. Mastery on the rack is banked first. Catalogue metals, codex unlocks and lifetime score remain. The next firing gains another 15% output.' + extra + "</p>" +
      '<div class="actions"><button type="button" class="btn" data-act="close">Not yet</button><button type="button" class="btn btn-ember" data-act="confirm-prestige">Bank the coals</button></div>',
      true
    );
    $("modal").dataset.kind = "prestige";
  }

  // ---------- input ----------

  function doStrike() {
    var now = performance.now();
    if (now - lastStrike < 150) return;
    lastStrike = now;
    ac();
    var ctx = ctxNow(false);
    L.strike(state, ctx);
    handle(ctx);
    swing();
    sparks();
    playStrike();
  }
  function selectTab(id, focus) {
    if (L.TABS.indexOf(id) < 0) return;
    state.tab = id;
    dirty = true;
    if (focus) { var t = $("tab-" + id); if (t) t.focus(); }
  }

  document.body.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.disabled) return;
    var a = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (a === "strike") doStrike();
    else if (a === "fold") act(function (c) { return L.fold(state, 1, c); });
    else if (a === "fold-all") act(function (c) { return L.fold(state, L.foldsAvailable(state), c); });
    else if (a === "suggest") {
      var w = weaponById[t.dataset.wid];
      if (w && L.needMet(state, w).ok && L.canAfford(state, w.cost) && state.jobs.length < L.slots(state)) {
        act(function (c) { return L.startForge(state, w.id, c, false); });
      } else if (w) { state.selected = w.id; selectTab("arms", false); }
    } else if (a === "tab") {
      selectTab(id, false);
      if (window.innerWidth < 861) {
        requestAnimationFrame(function () {
          var panel = document.querySelector(".panel");
          if (panel) panel.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
        });
      }
    }
    else if (a === "select") { if (weaponById[id]) { state.selected = id; state.tab = "arms"; dirty = true; } }
    else if (a === "forge") act(function (c) { return L.startForge(state, id, c, false); });
    else if (a === "pin") act(function () { return L.togglePin(state, id); });
    else if (a === "buy") act(function (c) { return L.buyUpgrade(state, id, c); });
    else if (a === "pact") act(function (c) { return L.startPact(state, id, c); });
    else if (a === "market") act(function (c) { return L.buyMarket(state, id, c); });
    else if (a === "retire") act(function (c) { return L.retire(state, Number(t.getAttribute("data-uid")), c, false); });
    else if (a === "retire-all") act(function (c) { return L.retireAll(state, c, false); });
    else if (a === "prestige-open") { if (L.canPrestige(state)) openPrestige(); else tell("This firing has not earned a rekindle"); }
    else if (a === "confirm-prestige") {
      var res = act(function (c) { return L.prestige(state, c); });
      if (res && res.ok) { modalReturnFocus = null; closeModal(); }
    }
    else if (a === "howto") openGuide();
    else if (a === "close") closeModal();
    else if (a === "mute") {
      muted = !muted;
      state.mute = muted;
      if (muted && audioCtx && audioCtx.state === "running") { try { audioCtx.suspend(); } catch (err) {} }
      updateMute();
      announce(muted ? "Sound off" : "Sound on");
      save();
    }
  });
  document.body.addEventListener("change", function (e) {
    if (e.target && e.target.getAttribute("data-act") === "auto") {
      var on = !!e.target.checked;
      act(function (c) { return L.setAuto(state, on, c); });
      announce(state.auto ? "Tending the pinned blade" : "Tending stopped");
    }
  });
  $("modal").addEventListener("click", function (e) {
    if (e.target.id === "modal" && $("modal").dataset.dismiss === "1") closeModal();
  });
  document.querySelector(".tabs").addEventListener("keydown", function (e) {
    var order = L.TABS;
    var i = order.indexOf(state.tab);
    var next = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = order[(i + 1) % order.length];
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = order[(i + order.length - 1) % order.length];
    else if (e.key === "Home") next = order[0];
    else if (e.key === "End") next = order[order.length - 1];
    if (!next) return;
    e.preventDefault();
    selectTab(next, true);
    renderPanel();
    dirty = false;
  });
  window.addEventListener("keydown", function (e) {
    if (modalOpen()) {
      if (e.key === "Escape" && $("modal").dataset.dismiss === "1") { e.preventDefault(); closeModal(); }
      else if (e.key === "Tab") {
        // Keep focus inside the open dialog.
        var items = Array.prototype.slice.call($("modal").querySelectorAll("button:not(:disabled)"));
        if (!items.length) return;
        var first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        else if (!$("modal").contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    var tgt = e.target;
    var onControl = tgt && tgt !== document.body && tgt.closest && tgt.closest("button, input, select, textarea, a[href], [tabindex]");
    if ((e.code === "Space" || e.key === " ") && !onControl) {
      e.preventDefault();
      doStrike();
    }
  });
  document.addEventListener("pointerdown", function () { ac(); }, { passive: true });

  // ---------- courier grants (inbound seam for catalogue metals) ----------

  function grant(material, amount, source) {
    var ctx = ctxNow(false);
    var res = L.grantMaterial(state, material, amount, source, ctx, grantTimes);
    handle(ctx);
    if (res.ok) save();
    return res;
  }
  window.addEventListener("message", function (ev) {
    var data = ev.data;
    if (!data || typeof data !== "object") return;
    if (data.type !== "rokumon:grant" && data.type !== "hub:material") return;
    if (ev.source !== window.parent || window.parent === window) return;
    if (ev.origin !== window.location.origin) return;
    grant(data.material, data.amount, data.source);
  });
  window.addEventListener("rokumon:grant", function (ev) {
    var d = ev.detail || {};
    grant(d.material, d.amount, d.source);
  });

  window.RokumonForge = {
    version: "1.1.0",
    grantMaterial: grant,
    getScore: function () { return L.computeScore(state); },
    getMaterials: function () {
      var copy = {};
      MATS.forEach(function (m) { copy[m.id] = state.mats[m.id]; });
      return copy;
    },
    getSnapshot: function () { return JSON.parse(L.serialize(state)); }
  };

  // ---------- boot and the frame loop ----------

  function comeBack(gapSeconds) {
    var ctx = ctxNow(false);
    var report = L.runOffline(state, gapSeconds, ctx);
    dirty = true;
    if (report.blades || Object.keys(report.gained).length) {
      hubEvent("offline-return", { seconds: Math.floor(report.counted), forged: report.blades });
      reportScore(false);
      if (!modalOpen()) openAway(report);
    }
    return report;
  }

  var boot = load();
  var bootNow = Date.now();
  var bootGap = L.wallGap(state, bootNow);
  if (bootGap >= L.OFFLINE_MIN_GAP) comeBack(bootGap);
  else if (bootGap > 0) { var bctx = ctxNow(false); L.simulate(state, bootGap, bctx); }
  L.markTime(state, bootNow);
  L.refreshMarket(state, bootNow, ctxNow(false));
  renderResources();
  renderDynamic();
  dirty = false;
  paint();
  updateMute();
  if (!state.welcomed && !modalOpen()) openGuide();
  if (boot.status === "reset") tell("The old save could not be read. A new forge is lit.");
  save();
  if (window.Hub && typeof window.Hub.ready === "function") { try { window.Hub.ready(); } catch (e) {} }
  reportScore(true);

  var lastPerf = performance.now();
  var lastSave = 0;
  function frame() {
    var perf = performance.now();
    var now = Date.now();
    var dt = Math.max(0, (perf - lastPerf) / 1000);
    lastPerf = perf;
    if (dt >= L.OFFLINE_MIN_GAP) {
      // The tab was hidden or the device slept: rAF stopped, so treat it as an absence.
      comeBack(Math.max(dt, L.wallGap(state, now)));
    } else if (dt > 0) {
      var ctx = ctxNow(false);
      L.simulate(state, dt, ctx);
      handle(ctx);
    }
    L.markTime(state, now);
    if (now - lastSave > 5000) {
      lastSave = now;
      if (L.refreshMarket(state, now, ctxNow(false))) dirty = true;
      reportScore(false);
      save();
    }
    if (dirty) { renderDynamic(); dirty = false; }
    paint();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { L.markTime(state, Date.now()); save(); }
  });
  window.addEventListener("pagehide", function () { L.markTime(state, Date.now()); save(); });
})();
</script>
</body>
</html>
